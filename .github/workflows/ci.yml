# saba-chan-extensions — critical lint (E9, F63, F7, F82) + pytest
#
# PR: Windows에서만 돌린다. 익스텐션은 Windows 데몬에서 실행되고,
#     Ubuntu pytest는 클라우드 작업에서 매번 돌린다.
# 전체 (Actions 탭 workflow_dispatch): Windows + Ubuntu
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["windows-latest","ubuntu-latest"]') || fromJSON('["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest ruff
      - run: python -m ruff check . --select E9,F63,F7,F82
      - run: python -m pytest -q
